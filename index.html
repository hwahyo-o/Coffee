<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-size: 24px;
            font-weight: 400;
            color: black;
            line-height: 1.3;
            background-color: white;
            font-family: '맑은 고딕', 'sans-serif';
        }
        div{
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        a{
            text-decoration: none;
            color: inherit;
            word-break: keep-all;
            text-align: center;
            display: flex;
            width: 100%;
            height: 100%;
        }
        .btn{
            border: 1px solid #bbb;
            height: 150px;
            margin: 15px;
            padding: 20px;
            width: 230px;
            border-radius: 20px;
        }
        .btn:hover{
            border: 3px solid mediumspringgreen;
            color: mediumspringgreen;
            background-color: black;
        }
    </style>
</head>

<body>
    <div>
